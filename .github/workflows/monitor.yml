name: World monitor

# Every 10 minutes: is the Emberlands world up? (game port with its certificate, and the board). A failed run makes
# GitHub e-mail the owner of this repository. Written by scripts/monitor/publish.sh of the game's repository: change it
# there, not here.
# Limits: GitHub starts scheduled runs late when it is busy (often 5 to 15 minutes, sometimes a skipped run), so an
# outage is noticed in 10 to 30 minutes, not at once; nothing is sent when the world comes back (the next run is green).
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Game port and board
        run: bash check-world.sh
      # GitHub switches a schedule off after 60 days without a commit in a public repository: leave one a month.
      - name: Keep the schedule alive
        if: always()
        run: |
          last="$(git log -1 --format=%ct)"
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%F > heartbeat.txt
            git config user.name "world-monitor"
            git config user.email "world-monitor@users.noreply.github.com"
            git add heartbeat.txt
            git commit -q -m "Monthly heartbeat (keeps the schedule on)"
            git push -q
          fi
